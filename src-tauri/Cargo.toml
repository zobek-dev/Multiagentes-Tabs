[package]
name = "multiagentes"
version = "0.1.5"
description = "Gestor de multiples terminales para agentes de linea de comandos"
authors = ["mediahuella"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "multiagentes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-opener = "2.5.5"
trash = "5.2.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
