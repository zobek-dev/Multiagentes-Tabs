name: Instaladores

# Construye los instaladores de macOS y Windows. Se ejecuta a mano desde la
# pestaña Actions, o automáticamente al publicar una etiqueta `v*`, que además
# publica una versión con los instaladores adjuntos.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            nombre: macos-apple-silicon
          - platform: macos-latest
            target: x86_64-apple-darwin
            nombre: macos-intel
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            nombre: windows
          # 22.04 y no una más reciente: el binario arrastra la glibc con la
          # que se compila, y en la nueva no arrancaría en distribuciones algo
          # más antiguas.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            nombre: linux

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev build-essential curl wget file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Pruebas
        run: npm test

      - name: Construir instalador
        run: npm run tauri build -- --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: multiagentes-${{ matrix.nombre }}
          # macOS deja el .dmg en bundle/dmg y Windows el .exe en bundle/nsis.
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # La aplicación avisa de versiones nuevas consultando la última versión
  # publicada, así que etiquetar tiene que dejar una con sus instaladores.
  publicar:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos

      - name: Publicar la versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archivos=$(find artefactos -type f \( -name '*.dmg' -o -name '*-setup.exe' \
            -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \))
          if [ -z "$archivos" ]; then
            echo "no hay instaladores que publicar" >&2
            exit 1
          fi
          echo "$archivos"
          gh release create "$GITHUB_REF_NAME" $archivos \
            --repo "$GITHUB_REPOSITORY" \
            --title "Multiagentes $GITHUB_REF_NAME" \
            --generate-notes
